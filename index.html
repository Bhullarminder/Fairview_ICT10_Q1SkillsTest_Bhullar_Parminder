<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seatwork 1</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container bg-light p-4 mt-5 w-50 rounded shadow">

    <h3>Coffee Shop</h3>

    <div class="mt-3">

        <input type="checkbox" id="americano" value="150">
        <label>Americano - ₱120</label>
        <br>

        <input type="checkbox" id="spanish_latte" value="180">
        <label>Spanish Latte - ₱150</label>
        <br>

        <input type="checkbox" id="cold_brew_malt" value="190">
        <label>Cold Brew Malt - ₱168</label>
        <br>

        <input type="checkbox" id="affogato" value="200">
        <label>Affogato - ₱180</label>
        <br><br>

        <input type="button" py-click="calculate_total" value="Calculate"
               class="btn btn-secondary">

    </div>

    <div id="subtotal" style="color:black; font-size:20px;" class="mt-3"></div>

</div>

<div id="receipt"></div>

<script type="py" src="main.py"></script>

</body>
</html>
